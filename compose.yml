name: orbit

services:
  db-prod:
    build:
      context: ./control
      dockerfile: postgres.Dockerfile
    container_name: orbit-db-prod
    env_file: ./prod/db.env
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=pt_BR.UTF-8
      LANG: pt_BR.UTF-8
    volumes:
      - db_prod_data:/var/lib/postgresql/data
    networks: [ prod_db_net ]
    restart: unless-stopped
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    memswap_limit: 1536m
    mem_reservation: 128m

  db-dev:
    build:
      context: ./control
      dockerfile: postgres.Dockerfile
    container_name: orbit-db-dev
    env_file: ./dev/db.env
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=pt_BR.UTF-8
      LANG: pt_BR.UTF-8
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    networks: [ dev_db_net ]
    restart: unless-stopped
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    memswap_limit: 1536m
    mem_reservation: 128m

  api-prod:
    build:
      context: ./prod/app
      dockerfile: ../Dockerfile
      target: api
      args:
        ORBIT_API_PROXY_URL: http://api-prod:4000
    image: orbit-api-prod:local
    container_name: orbit-prod-api
    env_file:
      - ./prod/.env
      - ./prod/data/config/api.env
    environment:
      ORBIT_ENV: production
      ORBIT_APP_NAME: Orbit
      ORBIT_APP_ICON_KIND: orbit
      ORBIT_HOST_PROJECTS_ROOT: /home/meada/projetos/orbit/safdoulas-v2
      ORBIT_CONTAINER_PROJECTS_ROOT: /host-projects/safdoulas-v2
      ORBIT_NEXT_DIST_DIR: .next-dev
      HOME: /tmp
      CODEX_HOME: /home/meada/.codex
    volumes:
      - ./prod/data/config:/data/config:rw
      - ./prod/data/backups:/data/backups:rw
      - ./prod/data/root-orbit-sessions:/home/meada/projetos/orbit/.orbit/sessions:rw
      - ./prod/data/api-orbit-sessions:/home/meada/projetos/orbit/apps/api/.orbit/sessions:rw
      - ./safdoulas-v2:/host-projects/safdoulas-v2:rw
      - safdoulas_v2_node_modules:/host-projects/safdoulas-v2/app/node_modules:ro
      - /home/meada/.codex/auth.json:/home/meada/.codex/auth.json:ro
    ports: [ '127.0.0.1:4000:4000' ]
    networks: [ prod_db_net, prod_net, control_net ]
    depends_on:
      db-prod: { condition: service_healthy }
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, node, -e, "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:2500});await c.connect();await c.query('SELECT 1');await c.end();const r=await fetch('http://127.0.0.1:4000/');process.exit(r.status<500?0:1)})().catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    mem_limit: 2g
    memswap_limit: 3g
    mem_reservation: 256m

  web-prod:
    build:
      context: ./prod/app
      dockerfile: ../Dockerfile
      target: web
      args:
        ORBIT_API_PROXY_URL: http://api-prod:4000
    image: orbit-web-prod:local
    container_name: orbit-prod-web
    environment:
      ORBIT_API_PROXY_URL: http://api-prod:4000
      WEB_HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports: [ '127.0.0.1:3000:3000' ]
    networks: [ prod_net ]
    depends_on:
      api-prod: { condition: service_healthy }
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: [ /tmp, /home/meada/projetos/orbit/apps/web/.next/cache ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 64m

  dev:
    build:
      context: ./dev/app
      dockerfile: ../Dockerfile
    image: orbit-dev:local
    container_name: orbit-dev
    env_file: ./dev/.env
    environment:
      ORBIT_ENV: development
      ORBIT_APP_NAME: Orbit Dev
      ORBIT_APP_ICON_KIND: orbit
      ORBIT_DEV_ALLOW_LOCAL_ONLY_MIGRATION_BACKUP: 'true'
      ORBIT_ALLOW_EXTERNAL_AUTOMATION: 'false'
      ORBIT_HOST_PROJECTS_ROOT: /
      ORBIT_CONTAINER_PROJECTS_ROOT: /host-filesystem
      HOME: /tmp
      CODEX_HOME: /home/meada/.local/share/orbit-codex
      ORBIT_API_PROXY_URL: http://127.0.0.1:4001
      ORBIT_NEXT_DIST_DIR: .next-dev
      THEME: dark
      PORT: '3001'
      WEB_HOSTNAME: 0.0.0.0
      ORBIT_DEV_BUILD_LOCK: /run/orbit-dev-locks/build.lock
      ORBIT_DEV_MEMORY_MODE: ${ORBIT_DEV_MEMORY_MODE:-conserve}
    volumes:
      - ./dev/app:/home/meada/projetos/orbit:rw
      - /:/host-filesystem:rw
      - ./dev/data/config:/data/config:rw
      - ./dev/data/backups:/data/backups:rw
      - ./dev/data/root-orbit-sessions:/home/meada/projetos/orbit/.orbit/sessions:rw
      - ./dev/data/api-orbit-sessions:/home/meada/projetos/orbit/apps/api/.orbit/sessions:rw
      - /home/meada/.codex/auth.json:/home/meada/.local/share/orbit-codex/auth.json:ro
      - ./control/state/dev-locks:/run/orbit-dev-locks:rw
    ports: [ '3001:3001', '127.0.0.1:4001:4001' ]
    networks: [ dev_db_net, dev_net, control_net ]
    depends_on:
      db-dev: { condition: service_healthy }
    restart: unless-stopped
    user: '1000:1000'
    tmpfs: [ '/tmp:rw,exec,nosuid,size=536870912' ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, node, -e, "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:2500});await c.connect();await c.query('SELECT 1');await c.end();const r=await Promise.all([fetch('http://127.0.0.1:4001/'),fetch('http://127.0.0.1:3001/')]);process.exit(r.every(x=>x.status<500)?0:1)})().catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    init: true
    mem_limit: 2500m
    memswap_limit: 3500m
    mem_reservation: 512m
    command:
      - npm
      - run
      - dev

  control:
    build:
      context: ./dev/app
      dockerfile: tools/orbit-control/Dockerfile
    image: orbit-control:local
    container_name: orbit-control
    env_file: ./control/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /home/meada/projetos/orbit:/home/meada/projetos/orbit:ro
      - ./control/state:/control/state:rw
      - ./control/state:/home/meada/projetos/orbit/control/state:rw
      - ./prod/app:/home/meada/projetos/orbit/prod/app:rw
      - ./safdoulas-v2/app:/home/meada/projetos/orbit/safdoulas-v2/app:rw
      - ./dev/data/config:/home/meada/projetos/orbit/dev/data/config:rw
      - ./prod/data/config:/home/meada/projetos/orbit/prod/data/config:rw
      - ./safdoulas-v2/data/config:/home/meada/projetos/orbit/safdoulas-v2/data/config:rw
      - ./control/backups:/control/backups:rw
      - ./control/snapshots:/control/snapshots:rw
    networks: [ control_net, prod_db_net, dev_db_net ]
    restart: unless-stopped
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5).status == 200" ]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 32m

networks:
  control_net: { name: orbit_control_net }
  prod_net: { name: orbit_prod_net }
  dev_net: { name: orbit_dev_net }
  prod_db_net: { name: orbit_prod_db_net, internal: true }
  dev_db_net: { name: orbit_dev_db_net, internal: true }

volumes:
  db_prod_data: { name: orbit_db_prod_data }
  db_dev_data: { name: orbit_db_dev_data }
  safdoulas_v2_node_modules:
    external: true
    name: orbit_safdoulas_v2_node_modules
