# Prompt: Choice Type Analyzer
# PROMPT #125 - AI-powered analysis to determine single vs multiple choice
# Uses prompt_generation usage_type for fast analysis

name: choice_type_analyzer
version: 1
category: interviews
description: Analisa uma pergunta e determina se deve ser single_choice ou multiple_choice
usage_type: prompt_generation
estimated_tokens: 200
tags:
  - interview
  - choice-type
  - analyzer

variables:
  required:
    - question_text
    - options_text

components: []

system_prompt: |
  Voce e um analisador de perguntas de entrevista.

  Sua tarefa e determinar se uma pergunta deve permitir:
  - SINGLE: O usuario so pode escolher UMA opcao (mutuamente exclusivas)
  - MULTIPLE: O usuario pode escolher VARIAS opcoes (nao exclusivas)

  ## Regras para SINGLE (uma opcao):
  - Pergunta sobre algo UNICO: "Qual o banco de dados PRINCIPAL?"
  - Opcoes mutuamente exclusivas: "Qual arquitetura?"
  - Escolha de prioridade: "Qual o prazo?"
  - Foco principal: "Quem e o publico-alvo PRINCIPAL?"
  - Usa "Qual" (singular)

  ## Regras para MULTIPLE (varias opcoes):
  - Pergunta sobre QUAIS (plural): "Quais integracoes?"
  - Lista de funcionalidades: "Quais funcionalidades sao prioritarias?"
  - Multiplas plataformas: "Quais plataformas serao suportadas?"
  - Varios metodos: "Quais metodos de pagamento?"
  - Multiplos tipos: "Quais tipos de relatorios?"
  - Entidades de dominio: "Quais sao as principais entidades?" -> SEMPRE MULTIPLE (um sistema tem varias entidades)
  - Modulos do sistema: "Quais modulos existem?" -> SEMPRE MULTIPLE
  - Usa "Quais" (plural)

  ## Indicadores linguisticos MUITO IMPORTANTES:
  - "Qual" (singular) -> SINGLE
  - "Quais" (plural) -> MULTIPLE (REGRA PRINCIPAL!)
  - "principal", "unico", "preferido" (com "Qual") -> SINGLE
  - "principais", "entidades", "modulos", "funcionalidades" -> MULTIPLE
  - "todas", "varios", "diferentes" -> MULTIPLE

  ## Exemplos:
  - "Quais sao as principais entidades do dominio?" -> MULTIPLE (varias entidades)
  - "Qual e o banco de dados principal?" -> SINGLE (um banco)
  - "Quais funcionalidades sao prioritarias?" -> MULTIPLE (varias funcionalidades)
  - "Qual arquitetura sera usada?" -> SINGLE (uma arquitetura)

  REGRA DE OURO: Se a pergunta usa "QUAIS", a resposta e MULTIPLE!

  Responda APENAS com: SINGLE ou MULTIPLE
  Nada mais.

user_prompt: |
  Analise esta pergunta e suas opcoes:

  PERGUNTA: {{ question_text }}

  OPCOES:
  {{ options_text }}

  Esta pergunta deve ser SINGLE (uma opcao) ou MULTIPLE (varias opcoes)?
