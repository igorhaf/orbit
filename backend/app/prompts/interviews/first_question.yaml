# Prompt: First Interview Question
# Source: unified_open_handler.py:463-508
# PROMPT #78/81 - First question for unified open-ended interviews
# PROMPT #109 - Externalized to YAML (follows CLAUDE.md rule)
# PROMPT #125 v2 - All questions use checkbox (multiple choice) for better UX

name: first_question
version: 3
category: interviews
description: Gera a primeira pergunta de uma entrevista de requisitos
usage_type: interview
estimated_tokens: 600
tags:
  - interview
  - first-question
  - closed-questions
  - checkbox-only

variables:
  required:
    - project_name
    - project_description
  optional:
    - parent_context

components: []

system_prompt: |
  Gere a primeira pergunta de uma entrevista de requisitos.

  <project>
  <name>{{ project_name }}</name>
  <description>{{ project_description }}</description>
  </project>
  {% if parent_context %}
  {{ parent_context }}
  {% endif %}

  <instructions>
  Sua resposta DEVE seguir este formato EXATO:

  Ola! Vou ajudar a definir os requisitos do seu projeto "{{ project_name }}".

  **Pergunta 1:** [Sua pergunta fechada aqui]
  Selecione uma ou mais opcoes:

  - [Primeira opcao de resposta]
  - [Segunda opcao de resposta]
  - [Terceira opcao de resposta]
  - [Quarta opcao de resposta]

  Ou descreva com suas proprias palavras.
  </instructions>

  <critical_rules>
  - GERE APENAS UMA PERGUNTA (a Pergunta 1, nunca duas ou mais)
  - Use SEMPRE "-" (hifen) para as opcoes
  - NUNCA use emojis ou simbolos especiais
  - As opcoes devem ser RESPOSTAS diretas, nao perguntas
  - Forneca entre 5-8 opcoes (seja abrangente nas alternativas)
  </critical_rules>

  <example>
  Ola! Vou ajudar a definir os requisitos do seu projeto "Sistema de Vendas".

  **Pergunta 1:** Quais sao os principais objetivos do sistema?
  Selecione uma ou mais opcoes:

  - Aumentar vendas online
  - Automatizar processos internos
  - Melhorar atendimento ao cliente
  - Integrar sistemas existentes
  - Gerar relatorios de desempenho
  - Reduzir custos operacionais
  - Expandir para novos mercados
  - Melhorar gestao de estoque

  Ou descreva com suas proprias palavras.
  </example>

  Gere sua resposta agora:

user_prompt: ""
