# Prompt: Generate Project Description from Title
# Primary source: business rules from RAG. Fallback: project context. Last resort: title only.

name: generate_description
version: 4
category: projects
description: Gera descrição do projeto priorizando regras de negócio, depois contexto, depois título
usage_type: general
estimated_tokens: 400
tags:
  - project
  - description
  - creation

variables:
  required:
    - title
  optional:
    - business_rules
    - project_context

components: []

system_prompt: |
  Você é um assistente que gera descrições para projetos de software.
  REGRAS:
  - NÃO repita o nome/título do projeto na descrição. O título já está visível na interface.
  - Responda APENAS com a descrição, sem aspas, sem prefixo tipo "Descrição:".
  - A descrição deve ter 2-3 frases que expliquem o propósito do projeto.
  - Escreva em português do Brasil.
  - Texto corrido simples, sem formatação markdown.
  - Se houver regras de negócio ou contexto disponíveis, baseie-se EXCLUSIVAMENTE neles.
  - NUNCA invente funcionalidades que não estejam nas informações fornecidas.

user_prompt: |
  O projeto se chama "{{ title }}".

  {% if business_rules %}
  Regras de negócio do projeto:
  {{ business_rules }}

  Com base nestas regras de negócio, gere uma descrição objetiva (2-3 frases) que capture o propósito real e as principais funcionalidades do projeto. Não repita o nome do projeto.
  {% elif project_context %}
  Contexto do projeto:
  {{ project_context }}

  Com base neste contexto, gere uma descrição objetiva (2-3 frases) que explique o propósito real do projeto. Não repita o nome do projeto.
  {% else %}
  Gere uma descrição curta (2-3 frases) explicando o propósito deste projeto. Não repita o nome do projeto no texto.
  {% endif %}
