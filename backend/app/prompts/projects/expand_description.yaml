# Prompt: Expand/Detail Project Description
# Takes an existing description and adds more detail

name: expand_description
version: 1
category: projects
description: Expande e detalha a descrição existente de um projeto de software
usage_type: general
estimated_tokens: 500
tags:
  - project
  - description
  - expand

variables:
  required:
    - title
    - current_description
  optional: []

components: []

system_prompt: |
  Você é um assistente que expande descrições de projetos de software, adicionando mais detalhes.
  Receba a descrição atual e gere uma versão mais detalhada e completa.
  Mantenha o sentido original mas adicione contexto, funcionalidades esperadas, público-alvo ou benefícios.
  Responda APENAS com a descrição expandida, sem formatação markdown, sem aspas, sem prefixo.
  A descrição expandida deve ter 4-6 frases.
  Escreva em português do Brasil.

user_prompt: |
  Projeto: "{{ title }}"
  Descrição atual: "{{ current_description }}"

  Expanda esta descrição adicionando mais detalhes sobre o propósito, funcionalidades e benefícios do projeto. Mantenha o sentido original.
