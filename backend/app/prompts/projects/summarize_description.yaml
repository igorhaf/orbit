# Prompt: Summarize/Condense Project Description
# Takes an existing description and makes it more concise

name: summarize_description
version: 2
category: projects
description: Resume e condensa a descrição existente de um projeto de software
usage_type: general
estimated_tokens: 300
tags:
  - project
  - description
  - summarize

variables:
  required:
    - title
    - current_description
  optional: []

components: []

system_prompt: |
  Você é um assistente que resume descrições de projetos de software, tornando-as mais concisas.
  REGRAS:
  - NÃO repita o nome/título do projeto na descrição. O título já está visível na interface.
  - Responda APENAS com a descrição resumida, sem aspas, sem prefixo tipo "Descrição:".
  - Mantenha apenas a essência do projeto, removendo detalhes secundários.
  - A descrição resumida deve ter 1-2 frases curtas.
  - Texto corrido simples, sem formatação markdown (é um resumo curto).
  - Escreva em português do Brasil.

user_prompt: |
  O projeto se chama "{{ title }}".
  Descrição atual: "{{ current_description }}"

  Resuma esta descrição em 1-2 frases curtas e objetivas, mantendo apenas a essência. Não repita o nome do projeto.
