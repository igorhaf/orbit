# Prompt: Generate Project Title from Description
# Simple, fast generation — reformulates a concise title

name: generate_title
version: 1
category: projects
description: Gera ou reformula um título curto para um projeto a partir da descrição
usage_type: general
estimated_tokens: 100
tags:
  - project
  - title
  - creation

variables:
  required:
    - description
  optional:
    - current_title

components: []

system_prompt: |
  Você é um assistente que gera títulos curtos e objetivos para projetos de software.
  Responda APENAS com o título, sem formatação, sem aspas, sem prefixo, sem explicação.
  O título deve ter no máximo 60 caracteres.
  Escreva em português do Brasil.

user_prompt: |
  {% if current_title %}Título atual: "{{ current_title }}"
  {% endif %}Descrição do projeto: "{{ description }}"

  Gere um título curto e descritivo (máximo 60 caracteres) para este projeto.
