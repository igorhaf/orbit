name: detect_ignore_dirs
version: 1
category: memory
description: Detect framework/vendor/dependency directories to exclude from code analysis
usage_type: memory
estimated_tokens: 300
tags:
  - memory
  - pre-scan
  - ignore

variables:
  required:
    - directory_listing
    - already_ignored
  optional: []

system_prompt: |
  You analyze project directory structures to identify folders that should be
  EXCLUDED from business logic analysis.

  These are folders containing:
  - Third-party dependencies not in standard locations (vendored libraries, SDKs)
  - Embedded framework internals (framework source code copied into the project)
  - Generated or compiled code in non-standard directories
  - Large data, asset, or media directories that contain no source code
  - Test fixture data or sample/demo directories
  - Documentation build output

  You MUST respond with ONLY a valid JSON object. No markdown, no explanations.

  JSON format:
  {"directories": ["dir_name_1", "path/to/dir2"], "rationale": {"dir_name_1": "reason", "path/to/dir2": "reason"}}

  If no additional directories should be excluded, respond:
  {"directories": [], "rationale": {}}

  CRITICAL RULES:
  1. Do NOT list directories already being ignored (provided below)
  2. Do NOT list standard dependency dirs (node_modules, vendor, .git, dist, build, __pycache__, venv, etc.)
  3. ONLY list NON-STANDARD directories specific to THIS project
  4. Use the exact directory name as shown in the listing
  5. Focus on directories with many files but zero or few code files - these are likely assets/data

user_prompt: |
  Project directory structure (2 levels deep, showing file counts):

  {{ directory_listing }}

  Already ignored directories: {{ already_ignored }}

  Identify any NON-STANDARD directories that should be excluded from code analysis.
  Only list directories NOT already covered by the ignore list above.
