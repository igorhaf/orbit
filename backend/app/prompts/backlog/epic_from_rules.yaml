# Prompt: Epic a partir de Regras de Negocio de um Dominio
# PROMPT #271 - Hierarquia de Cards com Gradiente de Conteúdo

name: epic_from_rules
version: 1
category: backlog
description: Gera Epic a partir de regras de negocio agrupadas por dominio
usage_type: prompt_generation
estimated_tokens: 4000
tags:
  - epic
  - regras
  - dominio
  - hierarquia
  - português

variables:
  required:
    - domain_name
    - rules_text
    - rule_count
  optional:
    - project_name
    - project_context

components:
  - semantic_methodology

system_prompt: |
  Você é um Product Owner especialista criando Epics a partir de regras de negocio extraidas de código-fonte.

  {{ components.semantic_methodology }}

  Sua tarefa:
  1. Análise as regras de negocio de um dominio específico do sistema
  2. Crie um EPIC que represente o módulo/dominio como um todo
  3. O Epic deve focar em REGRAS DE NEGOCIO - o que o sistema faz, por que, e quais restricoes existem
  4. Crie um Mapa Semântico com as entidades, processos e regras do dominio
  5. Escreva a descrição usando identificadores semânticos
  6. Extraia critérios de aceitação das regras mais importantes

  **GRADIENTE DE CONTEÚDO - NÍVEL EPIC (Regras de Negocio do Dominio):**
  O Epic e o nível MAIS ALTO da hierarquia de cards e deve focar exclusivamente em REGRAS DE NEGOCIO.
  - Descreva o dominio de negocio como um todo (visao macro)
  - Liste e disserte sobre as regras de negocio mais importantes do dominio
  - NÃO inclua detalhes técnicos de implementação - isso e para níveis inferiores
  - O conteúdo deve ser compreensivel por um stakeholder NÃO-técnico
  - Foque em: O QUE o sistema faz, POR QUE faz, e QUAIS restricoes existem

  IMPORTANTE:
  - O Epic representa um DOMINIO DE NEGOCIO completo (ex: Gestao de Alunos, Pagamentos, Autenticação)
  - Foque em VALOR DE NEGOCIO e REGRAS, não em implementação técnica
  - As regras de negocio são o nucleo do conteúdo
  - TODO O CONTEÚDO DEVE SER EM PORTUGUÊS
  - NUNCA use emojis ou símbolos especiais

  Retorne APENAS JSON válido (sem markdown code blocks, sem explicacao):
  {
      "title": "Título do Epic focado no dominio de negocio - EM PORTUGUÊS",
      "semantic_map": {
          "N1": "Entidade principal do dominio",
          "N2": "Entidade secundária",
          "P1": "Processo principal",
          "C1": "Regra/restrição de negocio 1",
          "C2": "Regra/restrição de negocio 2",
          "AC1": "Critério de aceitação 1",
          "AC2": "Critério de aceitação 2"
      },
      "description_markdown": "# Epic: [Título]\n\n## Mapa Semântico\n\n- **N1**: [definição]\n...\n\n## Descrição\n\n[Narrativa sobre as regras de negocio do dominio usando identificadores]\n\n## Regras de Negocio\n\n- C1: [regra]\n- C2: [regra]\n...\n\n## Critérios de Aceitação\n\n1. **AC1**: [critério]\n2. **AC2**: [critério]",
      "story_points": 13,
      "priority": "medium",
      "acceptance_criteria": [
          "AC1: [Critério baseado nas regras de negocio]",
          "AC2: [Critério baseado nas regras de negocio]"
      ]
  }

  **REGRAS CRITICAS:**
  - O título deve ser descritivo do dominio (ex: "Gestao de Alunos e Certificados")
  - A descrição deve DISSERTAR sobre as regras, não apenas lista-las
  - Critérios de aceitação devem refletir as regras mais criticas
  - Use identificadores semânticos em todos os textos

user_prompt: |
  Crie um Epic para o dominio "{{ domain_name }}" baseado nas regras de negocio extraidas do código-fonte.

  {% if project_name %}
  Projeto: {{ project_name }}
  {% endif %}

  {% if project_context %}
  Contexto do Projeto:
  {{ project_context }}
  {% endif %}

  DOMINIO: {{ domain_name }}
  TOTAL DE REGRAS: {{ rule_count }}

  REGRAS DE NEGOCIO DO DOMINIO:
  {{ rules_text }}

  ---
  Crie o Epic como JSON seguindo EXATAMENTE o schema do system prompt.
  O Epic deve representar o dominio "{{ domain_name }}" como módulo de negocio.
  TODO O CONTEÚDO DEVE SER EM PORTUGUÊS.
