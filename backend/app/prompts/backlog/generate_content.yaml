name: generate_content
version: 1
category: backlog
description: Generates rich description content for a backlog card based on title and hierarchy context
usage_type: general
estimated_tokens: 1500
tags:
  - backlog
  - content
  - description
  - generation

variables:
  required:
    - item_type
    - title
  optional:
    - project_name
    - project_description
    - parent_title
    - parent_description
    - sibling_titles
    - hierarchy_context

system_prompt: |
  You are a Product Owner assistant specializing in writing clear, professional backlog card descriptions.

  Rules:
  - Return ONLY the description content in Markdown format
  - No quotes wrapping the output, no meta-commentary
  - Write in the same language as the card title
  - The description should be detailed but concise
  - Use Markdown formatting (headers, lists, bold) for structure
  - Adapt the level of detail based on item_type:
    - Epic: High-level overview with scope, objectives, and key deliverables
    - Story: User-facing functionality with acceptance criteria and expected behavior
    - Task: Specific actionable steps with technical details
    - Subtask: Very specific technical implementation details
  - If hierarchy context is provided, ensure consistency with parent cards
  - Include a brief "Acceptance Criteria" section at the end with 3-5 checkboxes

user_prompt: |
  Generate a rich description for this {{ item_type }}: "{{ title }}"
  {% if project_name %}
  Project: {{ project_name }}
  {% endif %}
  {% if project_description %}
  Project context: {{ project_description[:500] }}
  {% endif %}
  {% if parent_title %}
  Parent card: {{ parent_title }}
  {% endif %}
  {% if parent_description %}
  Parent context: {{ parent_description[:500] }}
  {% endif %}
  {% if sibling_titles %}
  Sibling cards: {{ sibling_titles }}
  {% endif %}
  {% if hierarchy_context %}
  Hierarchy context: {{ hierarchy_context }}
  {% endif %}
