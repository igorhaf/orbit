# Prompt: Convention Extraction from Code Samples
# Source: convention_extractor.py:196-227

name: convention_extraction
version: 1
category: discovery
description: Extrai convencoes de codigo de amostras de arquivos do projeto
usage_type: general
estimated_tokens: 2000
tags:
  - discovery
  - conventions
  - code-analysis

variables:
  required:
    - files_text
  optional:
    - detected_stack

components: []

system_prompt: ""

user_prompt: |
  Analyze the following code samples from a {{ detected_stack | default('software') }} project and extract the coding conventions used.

  {% if detected_stack %}
  Detected stack: {{ detected_stack }}
  {% endif %}

  {{ files_text }}

  Please analyze the code and return a JSON object with the following structure:

  {
    "naming": {
      "classes": "PascalCase|snake_case|...",
      "methods": "camelCase|snake_case|...",
      "variables": "camelCase|snake_case|...",
      "constants": "UPPER_SNAKE_CASE|...",
      "files": "kebab-case|snake_case|PascalCase|...",
      "database": {"tables": "snake_case|...", "columns": "snake_case|..."}
    },
    "architecture": {
      "pattern": "MVC|Repository|Service Layer|...",
      "uses_repositories": true|false,
      "uses_services": true|false,
      "layered_architecture": true|false
    },
    "code_style": {
      "indentation": "2 spaces|4 spaces|tabs",
      "quotes": "single|double",
      "semicolons": true|false,
      "trailing_commas": true|false
    }
  }

  Return ONLY the JSON object, no explanations.
