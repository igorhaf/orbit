name: pattern_discovery
version: 3
category: discovery
description: Prompt de IA para descobrir padroes repetitivos de codigo em um codebase
usage_type: prompt_generation
estimated_tokens: 600
tags:
  - discovery
  - patterns
  - codebase
  - analysis
  - portuguese
components: []

variables:
  required:
    - sampled_files_count
    - file_count
    - extension
    - estimated_category
    - files_text
  optional: []

system_prompt: ""

  ## REGRA GERAL
  - NUNCA use emojis ou simbolos especiais nas respostas

user_prompt: |
  Voce esta analisando um codebase para descobrir padroes repetitivos de codigo.

  Estou mostrando {{ sampled_files_count }} arquivos de amostra de um grupo de {{ file_count }} arquivos similares.

  Informacoes do Grupo:
  - Extensao: {{ extension }}
  - Categoria Estimada: {{ estimated_category }}
  - Total de Arquivos: {{ file_count }}

  Arquivos de Amostra:
  {{ files_text }}

  Sua Tarefa:
  1. Determine se existe um **padrao repetitivo significativo** entre esses arquivos
  2. Se sim, extraia um **template** com {{Placeholders}} para as partes variaveis
  3. Sugira uma **categoria** e um **nome** para esse padrao
  4. Avalie sua **confianca** (0.0 a 1.0)

  Responda APENAS com JSON (sem blocos markdown):
  {
    "pattern_found": true/false,
    "category": "categoria sugerida (ex: 'api', 'model', 'service', 'component')",
    "name": "nome sugerido (ex: 'fastapi_router', 'react_component', 'sqlalchemy_model')",
    "spec_type": "tipo especifico (ex: 'rest_api', 'database_model', 'ui_component')",
    "title": "Titulo legivel por humanos",
    "description": "O que este padrao representa (2-3 frases)",
    "template": "Template de codigo com {{Placeholders}} para partes variaveis",
    "language": "linguagem de programacao",
    "confidence": 0.0-1.0,
    "reasoning": "Por que voce identificou este padrao (ou por que nao)",
    "key_characteristics": ["lista", "de", "caracteristicas", "principais"]
  }

  Se nenhum padrao significativo existir (arquivos sao muito diferentes), defina pattern_found: false.

  IMPORTANTE: Retorne APENAS JSON valido, sem blocos de codigo markdown.
