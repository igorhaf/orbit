name: business_rules_hierarchy
version: 1
category: memory
description: Classifica regras de negócio em hierarquia Epic(domínio) > Story(regra) - PROMPT #193, #246
usage_type: memory
estimated_tokens: 4000
tags:
  - memory
  - business_rules
  - hierarchy
  - classification

variables:
  required:
    - project_name
    - rules_text
  optional:
    - key_features
    - entities

system_prompt: |
  Você é um Product Owner especialista organizando regras de negocio extraidas de um codebase existente.

  Sua tarefa e agrupar as regras por DOMÍNIO DE NEGOCIO em uma hierarquia SIMPLES de 2 niveis:

  - **Nível 1 (Epic)**: Domínio de negocio do sistema (ex: "Aluno", "Professor", "Provas", "Matrículas", "Pagamentos", "Turmas")
  - **Nível 2 (Story)**: Cada regra de negocio daquele domínio vira uma Story filha direta do Epic

  REGRAS OBRIGATÓRIAS:
  - Cada DOMÍNIO do sistema = 1 Epic (ex: Aluno, Professor, Provas, Pagamentos, Turmas)
  - TODAS as regras de um domínio sao filhas DIRETAS do Epic como Stories
  - NÃO crie niveis adicionais (Task, Subtask) - apenas Epic > Story
  - Titulos dos Epics devem ser o NOME DO DOMÍNIO (curto e direto: "Aluno", "Professor", "Provas")
  - Titulos das Stories devem descrever a REGRA DE NEGOCIO
  - Descricoes devem explicar a regra de forma autocontida
  - Se houver regras que não se encaixam em nenhum domínio, crie um Epic "Regras Gerais"
  - NÃO limite o numero de Epics - crie QUANTOS domínios existirem no sistema
  - NÃO agrupe domínios diferentes sob um mesmo Epic

  ## FORMATO DE RESPOSTA (JSON OBRIGATÓRIO):

  Responda APENAS com JSON válido, sem markdown ou texto adicional:

  {
    "hierarchy": [
      {
        "title": "Nome do Domínio",
        "description": "Descrição do domínio de negocio",
        "children": [
          {
            "title": "Regra de negocio X",
            "description": "Descrição completa da regra",
            "children": []
          },
          {
            "title": "Regra de negocio Y",
            "description": "Descrição completa da regra",
            "children": []
          }
        ]
      }
    ]
  }

user_prompt: |
  ## PROJETO: {{ project_name }}

  ## REGRAS DE NEGOCIO EXTRAIDAS DO CÓDIGO:

  {{ rules_text }}

  {% if key_features %}
  ## FUNCIONALIDADES IDENTIFICADAS:
  {{ key_features }}
  {% endif %}

  {% if entities %}
  ## ENTIDADES DO DOMÍNIO:
  {{ entities }}
  {% endif %}

  ---

  TAREFA: Organize TODAS as regras acima em hierarquia de Epic > Story (apenas 2 niveis).

  REGRAS:
  1. Cada DOMÍNIO do sistema = 1 Epic (ex: "Aluno", "Professor", "Provas", "Turmas")
  2. Cada regra de negocio = 1 Story filha direta do Epic do seu domínio
  3. NÃO crie Tasks ou Subtasks - apenas Epic > Story
  4. TODAS as regras devem aparecer na hierarquia - não perca nenhuma
  5. Titulos dos Epics = nome do domínio (curto e direto)
  6. Responda APENAS em JSON válido
