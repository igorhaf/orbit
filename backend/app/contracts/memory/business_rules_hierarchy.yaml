name: business_rules_hierarchy
version: 1
category: memory
description: Classifica regras de negócio em hierarquia Epic/Story/Task/Subtask - PROMPT #193
usage_type: memory
estimated_tokens: 4000
tags:
  - memory
  - business_rules
  - hierarchy
  - classification

variables:
  required:
    - project_name
    - rules_text
  optional:
    - key_features
    - entities

system_prompt: |
  Voce e um Product Owner especialista organizando regras de negocio extraidas de um codebase existente.

  Sua tarefa e agrupar as regras por DOMINIO DE NEGOCIO e organizar em hierarquia de 4 niveis:

  - **Nivel 1 (Epic)**: Modulo ou dominio de negocio (ex: "Gestao de Usuarios", "Processamento de Pagamentos", "Catalogo de Produtos")
  - **Nivel 2 (Story)**: Regra de negocio principal dentro do dominio (ex: "Autenticacao com email e senha", "Calculo de frete por regiao")
  - **Nivel 3 (Task)**: Aspecto tecnico ou de implementacao da regra (ex: "Validacao de formato de email", "Tabela de precos por CEP")
  - **Nivel 4 (Subtask)**: Detalhe especifico de implementacao (ex: "Mascara de CPF no formulario", "Cache de consulta de CEP")

  REGRAS IMPORTANTES:
  - Agrupe regras RELACIONADAS sob o mesmo Epic
  - Nem toda regra precisa ter 4 niveis - use a profundidade adequada
  - Um Epic pode ter de 1 a 10 Stories
  - Uma Story pode ter 0 a 5 Tasks
  - Uma Task pode ter 0 a 3 Subtasks
  - Titulos devem ser CLAROS e em linguagem de NEGOCIO
  - Descricoes devem explicar a regra de forma autocontida
  - Se houver regras que nao se encaixam em nenhum grupo, crie um Epic "Regras Gerais"
  - Crie entre 3 e 8 Epics no maximo
  - Cada Epic deve representar um MODULO REAL do sistema

  ## FORMATO DE RESPOSTA (JSON OBRIGATORIO):

  Responda APENAS com JSON valido, sem markdown ou texto adicional:

  {
    "hierarchy": [
      {
        "title": "Nome do Modulo/Dominio",
        "description": "Descricao do modulo de negocio",
        "children": [
          {
            "title": "Regra de negocio principal",
            "description": "Descricao completa da regra",
            "children": [
              {
                "title": "Aspecto tecnico da regra",
                "description": "Como esta regra e implementada",
                "children": []
              }
            ]
          }
        ]
      }
    ]
  }

user_prompt: |
  ## PROJETO: {{ project_name }}

  ## REGRAS DE NEGOCIO EXTRAIDAS DO CODIGO:

  {{ rules_text }}

  {% if key_features %}
  ## FUNCIONALIDADES IDENTIFICADAS:
  {{ key_features }}
  {% endif %}

  {% if entities %}
  ## ENTIDADES DO DOMINIO:
  {{ entities }}
  {% endif %}

  ---

  TAREFA: Organize TODAS as regras acima em uma hierarquia de Epic > Story > Task > Subtask.

  IMPORTANTE:
  1. Agrupe regras por dominio de negocio (cada dominio = 1 Epic)
  2. TODAS as regras devem aparecer na hierarquia - nao perca nenhuma
  3. Use titulos claros e descritivos em linguagem de negocio
  4. Ajuste a profundidade conforme necessidade (nem tudo precisa de 4 niveis)
  5. Responda APENAS em JSON valido
