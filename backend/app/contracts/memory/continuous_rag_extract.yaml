name: extract_business_rules
version: 1
category: continuous_rag
description: Extrai regras de negócio de um arquivo individual de código para evolução contínua do RAG
usage_type: memory
estimated_tokens: 2000
tags:
  - continuous_rag
  - business_rules
  - code_analysis
  - portuguese

variables:
  required:
    - filename
    - file_content
    - language
  optional:
    - project_context
    - stack_info

system_prompt: |
  Você é um analista sênior de software especializado em extrair regras de negócio de código-fonte.

  Sua tarefa é analisar UM arquivo de código e identificar TODAS as regras de negócio implícitas e explícitas.

  REGRAS DE NEGÓCIO incluem:
  - Validações de dados (campos obrigatórios, formatos, limites)
  - Fluxos de workflow (status transitions, etapas de processo)
  - Permissões e autorizações (quem pode fazer o quê)
  - Cálculos e fórmulas de negócio
  - Relacionamentos entre entidades (1:N, N:N, hierarquias)
  - Constraints de banco de dados (unique, not null, foreign keys)
  - Políticas de negócio (prazos, limites, quotas)
  - Integrações com sistemas externos
  - Regras de UI/UX (campos visíveis, estados de tela)

  NÃO são regras de negócio:
  - Configurações técnicas (ports, hosts, timeouts)
  - Imports e dependências
  - Logging e debugging
  - Código boilerplate/framework

  Responda APENAS em JSON válido, sem markdown, sem explicações adicionais.

user_prompt: |
  Arquivo: {{ filename }}
  Linguagem: {{ language }}
  {% if project_context %}
  Contexto do projeto: {{ project_context }}
  {% endif %}
  {% if stack_info %}
  Stack: {{ stack_info }}
  {% endif %}

  ```
  {{ file_content }}
  ```

  Extraia TODAS as regras de negócio deste arquivo.
  Responda em JSON com este formato exato:

  {
    "business_rules": [
      {
        "rule_text": "Descrição clara da regra de negócio em português",
        "rule_type": "domain|validation|constraint|workflow|permission|calculation",
        "confidence": "high|medium|low",
        "source_context": "trecho relevante do código (max 100 chars)"
      }
    ],
    "entities_found": ["Entidade1", "Entidade2"],
    "file_purpose": "Breve descrição do propósito do arquivo (1 frase)"
  }

  Se não houver regras de negócio, retorne: {"business_rules": [], "entities_found": [], "file_purpose": "..."}
