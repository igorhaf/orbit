# Contrato de Validação: Regras de Qualidade de Resposta
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/services/general_response_validator.py (linhas 26-67)
# Validador pos-processamento sem chamadas de IA - padrões e limiares.
# IMPORTANTE: Todas as saidas deste contrato devem ser em português.

name: response_rules
version: 1
domain: business
category: validation
description: Padrões de validação de resposta, limiares e marcadores de idioma
usage_type: _config

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do general_response_validator.py - padrões hardcoded"

tags:
  - validação
  - resposta
  - detecção-de-erros
  - qualidade

data:
  # Padrões regex indicando erros de API/servidor na resposta
  error_patterns:
    - "rate\\s+limit\\s+(?:exceeded|reached|error)"
    - "(?:internal\\s+)?server\\s+error"
    - "API\\s+(?:key|token)\\s+(?:invalid|expired|missing)"
    - "quota\\s+(?:exceeded|exhausted)"
    - "(?:connection|timeout)\\s+(?:error|refused|timed\\s+out)"
    - "HTTPError|HTTPException|status_code\\s*[:=]\\s*[45]\\d\\d"

  # Padrões regex indicando recusa da IA
  refusal_patterns:
    - "^I(?:'m| am) (?:sorry|unable|not able)"
    - "^(?:Desculpe|Não posso|Não consigo|Infelizmente)"
    - "I (?:cannot|can't|am unable to) (?:help|assist|provide|generate|create)"

  # Mínimo de caracteres na resposta por nível de complexidade
  min_response_chars:
    simple: 10
    moderate: 30
    complex: 50

  # Máximo de caracteres na resposta por nível de complexidade (0 = ilimitado)
  max_response_chars:
    simple: 2000
    moderate: 8000
    complex: 0

  # Marcadores de idioma português para detecção de lingua
  pt_markers:
    - de
    - da
    - do
    - das
    - dos
    - em
    - no
    - na
    - nos
    - nas
    - para
    - por
    - com
    - sem
    - sobre
    - entre
    - depois
    - antes
    - que
    - uma
    - um
    - seu
    - sua
    - seus
    - suas
    - este
    - esta
    - esse
    - essa
    - isso
    - isto
    - aquilo

  # Marcadores de idioma ingles
  en_markers:
    - the
    - is
    - are
    - was
    - were
    - have
    - has
    - had
    - will
    - would
    - could
    - should
    - can
    - may
    - might
    - this
    - that
    - these
    - those
    - with
    - from
    - into
    - upon
    - about
    - between
    - through
    - during
    - before
    - after

rules:
  constraints:
    - id: C1
      description: "Todos os padrões usam regex case-insensitive"
      condition: "re.IGNORECASE applied to all patterns"
    - id: C2
      description: "Padrões de recusa verificam apenas o início da resposta"
      condition: "pattern starts with ^ anchor"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
