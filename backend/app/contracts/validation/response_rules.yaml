# Validation Contract: Response Quality Rules
# PROMPT #256 - Externalize Hardcoded Contracts
#
# Source: backend/app/services/general_response_validator.py (lines 26-67)
# Zero-AI-call post-process validator patterns and thresholds.

name: response_rules
version: 1
domain: business
category: validation
description: Response validation patterns, thresholds, and language markers
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalized from general_response_validator.py hardcoded patterns"

tags:
  - validation
  - response
  - error-detection
  - quality

data:
  # Regex patterns indicating API/server errors in response
  error_patterns:
    - "rate\\s+limit\\s+(?:exceeded|reached|error)"
    - "(?:internal\\s+)?server\\s+error"
    - "API\\s+(?:key|token)\\s+(?:invalid|expired|missing)"
    - "quota\\s+(?:exceeded|exhausted)"
    - "(?:connection|timeout)\\s+(?:error|refused|timed\\s+out)"
    - "HTTPError|HTTPException|status_code\\s*[:=]\\s*[45]\\d\\d"

  # Regex patterns indicating AI refusal
  refusal_patterns:
    - "^I(?:'m| am) (?:sorry|unable|not able)"
    - "^(?:Desculpe|Nao posso|Nao consigo|Infelizmente)"
    - "I (?:cannot|can't|am unable to) (?:help|assist|provide|generate|create)"

  # Min response characters by complexity tier
  min_response_chars:
    simple: 10
    moderate: 30
    complex: 50

  # Max response characters by complexity tier (0 = unlimited)
  max_response_chars:
    simple: 2000
    moderate: 8000
    complex: 0

  # Portuguese language markers for language detection
  pt_markers:
    - de
    - da
    - do
    - das
    - dos
    - em
    - no
    - na
    - nos
    - nas
    - para
    - por
    - com
    - sem
    - sobre
    - entre
    - depois
    - antes
    - que
    - uma
    - um
    - seu
    - sua
    - seus
    - suas
    - este
    - esta
    - esse
    - essa
    - isso
    - isto
    - aquilo

  # English language markers
  en_markers:
    - the
    - is
    - are
    - was
    - were
    - have
    - has
    - had
    - will
    - would
    - could
    - should
    - can
    - may
    - might
    - this
    - that
    - these
    - those
    - with
    - from
    - into
    - upon
    - about
    - between
    - through
    - during
    - before
    - after

rules:
  constraints:
    - id: C1
      description: "All patterns are case-insensitive regex"
      condition: "re.IGNORECASE applied to all patterns"
    - id: C2
      description: "Refusal patterns check start of response only"
      condition: "pattern starts with ^ anchor"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
