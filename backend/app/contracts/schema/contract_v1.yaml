# Schema de Contratos v1.0
# PROMPT #164 - Arquitetura de Contratos: Unificacao e Governanca
#
# Esta e a definicao de schema mestre para contratos ORBIT.
# Todos os contratos devem seguir esta estrutura.

name: contract_schema
version: 1
domain: component
category: schema
description: Definicao de schema mestre para contratos ORBIT

# =============================================================================
# ESPECIFICACAO DO SCHEMA DE CONTRATOS
# =============================================================================

schema_version: "1.0"

# -----------------------------------------------------------------------------
# SECAO DE METADADOS (Obrigatoria)
# -----------------------------------------------------------------------------
# name: string (obrigatorio)
#   - Identificador unico do contrato
#   - Usar snake_case
#   - Exemplo: "epic_from_interview", "project_creation"
#
# version: integer (obrigatorio)
#   - Numero de versao do contrato, comeca em 1
#   - Incrementar ao fazer mudancas incompativeis
#
# domain: string (obrigatorio)
#   - Um de: business, interview, generation, memory, component
#   - business: Regras e processos de negocio centrais
#   - interview: Definicoes de fluxo de entrevista
#   - generation: Contratos de geracao de conteudo
#   - memory: Contratos de analise de codebase
#   - component: Componentes reutilizaveis
#
# category: string (obrigatorio)
#   - Nome da pasta onde o contrato reside
#   - Exemplos: business, generation, interviews, memory, commits, components
#
# description: string (opcional)
#   - Descricao legivel do proposito do contrato
#
# usage_type: string (opcional)
#   - Tipo de uso de IA para roteamento do orquestrador
#   - Exemplos: task_execution, interview, prompt_generation, memory, general

# -----------------------------------------------------------------------------
# SECAO DE GOVERNANCA (Opcional)
# -----------------------------------------------------------------------------
# governance:
#   status: draft | active | deprecated
#     - draft: Contrato em desenvolvimento
#     - active: Contrato em uso em producao
#     - deprecated: Contrato agendado para remocao
#
#   owner: string
#     - Equipe ou individuo responsavel pelo contrato
#
#   effective_date: string (data ISO)
#     - Quando o contrato entrou em vigor
#
#   expires_at: string (data ISO) | null
#     - Data de expiracao opcional
#
#   change_log: array
#     - version: integer
#       date: string (data ISO)
#       author: string
#       changes: string

# -----------------------------------------------------------------------------
# SECAO DE MAPA SEMANTICO (Opcional, para metodologia PROMPT #83)
# -----------------------------------------------------------------------------
# semantic_map:
#   N1: "Descricao da entidade primaria"
#   N2: "Descricao da entidade secundaria"
#   P1: "Descricao do processo principal"
#   E1: "Descricao do endpoint de API"
#   D1: "Descricao da estrutura de dados"
#   S1: "Descricao do servico"
#   C1: "Descricao da restricao"
#   AC1: "Descricao do criterio de aceitacao"
#
# Categorias de Identificadores:
#   N = Substantivos (entidades, objetos)
#   P = Processos (acoes, fluxos)
#   E = Endpoints (APIs)
#   D = Dados (schemas, estruturas)
#   S = Servicos (integracoes)
#   C = Restricoes (regras de negocio)
#   AC = Criterios de Aceitacao (condicoes de verificacao)
#   R = Requisitos (requisitos funcionais)

# -----------------------------------------------------------------------------
# SECAO DE REGRAS (Opcional)
# -----------------------------------------------------------------------------
# rules:
#   validations:
#     - id: string (ex., "V1")
#       description: string
#       expression: string (logica de validacao)
#       severity: error | warning | info
#
#   constraints:
#     - id: string (ex., "C1")
#       description: string
#       applies_to: array de identificadores
#       condition: string
#
#   access_control:
#     - id: string (ex., "AC1")
#       description: string
#       roles: array de nomes de roles
#       action: read | write | delete | execute

# -----------------------------------------------------------------------------
# SECAO DE VARIAVEIS (Obrigatoria se prompts usam variaveis)
# -----------------------------------------------------------------------------
# variables:
#   required:
#     - name: string
#       type: string | number | boolean | object | array
#       description: string
#
#   optional:
#     - name: string
#       type: string
#       default: any
#       description: string

# -----------------------------------------------------------------------------
# SECAO DE COMPONENTES (Opcional)
# -----------------------------------------------------------------------------
# components:
#   - component_name
#   - another_component
#
# Componentes sao carregados da pasta contracts/components/
# Referencie em prompts usando {{ components.component_name }}

# -----------------------------------------------------------------------------
# SECAO DE PROMPTS (Obrigatoria para contratos de geracao)
# -----------------------------------------------------------------------------
# system_prompt: |
#   Template Jinja2 multi-linha para mensagem de sistema.
#   Pode referenciar:
#   - {{ variable_name }} - Variaveis da secao variables
#   - {{ components.component_name }} - Conteudo de componente carregado
#   - {{ semantic_map.N1 }} - Valores do mapa semantico
#
# user_prompt: |
#   Template Jinja2 multi-linha para mensagem do usuario.
#   Mesmas referencias de variaveis que system_prompt.

# -----------------------------------------------------------------------------
# SECAO DE VALIDADORES (Opcional)
# -----------------------------------------------------------------------------
# validators:
#   - type: json_schema
#     schema:
#       type: object
#       required: [field1, field2]
#       properties:
#         field1: { type: string }
#
#   - type: regex
#     field: field_name
#     pattern: "^[A-Z].*"
#     message: "Campo deve comecar com letra maiuscula"
#
#   - type: semantic_check
#     rule: "Todos os identificadores semanticos devem estar definidos no semantic_map"
#
#   - type: length
#     field: field_name
#     min_length: 10
#     max_length: 1000
#
#   - type: required_fields
#     required: [field1, field2]

# -----------------------------------------------------------------------------
# SECAO DE EXECUCAO (Opcional)
# -----------------------------------------------------------------------------
# execution:
#   estimated_tokens: integer
#     - Uso esperado de tokens para este contrato
#
#   max_tokens: integer
#     - Maximo de tokens permitido (padrao: 4000)
#
#   recommended_model: string
#     - Modelo sugerido (ex., "claude-sonnet-4")
#
#   temperature: float
#     - Temperatura do modelo (padrao: 0.7)
#
#   cache_enabled: boolean
#     - Se deve cachear respostas (padrao: true)
#
#   cache_ttl: integer
#     - TTL do cache em segundos (padrao: 86400 = 24h)

# -----------------------------------------------------------------------------
# SECAO DE TAGS (Opcional)
# -----------------------------------------------------------------------------
# tags:
#   - tag1
#   - tag2
#
# Usado para filtragem e categorizacao

# =============================================================================
# CONTRATO DE EXEMPLO
# =============================================================================

example:
  name: example_contract
  version: 1
  domain: generation
  category: examples
  description: Contrato de exemplo mostrando todos os campos disponiveis
  usage_type: prompt_generation

  governance:
    status: active
    owner: "ORBIT Team"
    effective_date: "2026-02-04"
    change_log:
      - version: 1
        date: "2026-02-04"
        author: "Claude"
        changes: "Versao inicial"

  semantic_map:
    N1: "Usuario"
    N2: "Projeto"
    P1: "Processo de criacao"
    D1: "Dados do usuario"
    C1: "Email deve ser unico"
    AC1: "Usuario pode criar projetos"

  rules:
    validations:
      - id: V1
        description: "Email deve ter formato valido"
        expression: "N1.email matches email regex"
        severity: error
    constraints:
      - id: C1
        description: "Usuario deve estar autenticado"
        applies_to: [N1]
        condition: "N1.is_authenticated == true"

  variables:
    required:
      - name: user_name
        type: string
        description: "Nome do usuario"
    optional:
      - name: project_count
        type: number
        default: 0
        description: "Numero de projetos existentes"

  components:
    - json_output_rules

  system_prompt: |
    Voce e um assistente ajudando com {{ semantic_map.N2 }}.

    {{ components.json_output_rules }}

  user_prompt: |
    Usuario: {{ user_name }}
    Projetos: {{ project_count | default(0) }}

  validators:
    - type: json_schema
      schema:
        type: object
        required: [result]
        properties:
          result: { type: string }

  execution:
    estimated_tokens: 500
    max_tokens: 2000
    recommended_model: "claude-sonnet-4"
    temperature: 0.7
    cache_enabled: true
    cache_ttl: 86400

  tags:
    - exemplo
    - documentacao
