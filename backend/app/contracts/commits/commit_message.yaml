# Prompt: Geracao de Mensagem de Commit
# Source: commit_generator.py:208-266
# Usa Gemini via AIOrchestrator

name: commit_message
version: 2
category: commits
description: Gera mensagens de commit profissionais seguindo Conventional Commits
usage_type: commit_generation
estimated_tokens: 500
tags:
  - commit
  - git
  - conventional-commits

variables:
  required:
    - task_title
    - task_description
    - task_status
    - changes
  optional: []

components: []

system_prompt: ""

  ## REGRA GERAL
  - NUNCA use emojis ou simbolos especiais nas respostas

user_prompt: |
  Gere uma mensagem de commit profissional seguindo a especificacao Conventional Commits.

  INFORMACOES DA TAREFA:
  Titulo: {{ task_title }}
  Descricao: {{ task_description | default('Sem descricao') }}
  Status: {{ task_status }}

  ALTERACOES REALIZADAS:
  {{ changes }}

  TIPOS DE COMMIT CONVENCIONAL:
  - feat: Nova funcionalidade
  - fix: Correcao de bug
  - docs: Apenas documentacao
  - style: Estilo/formatacao de codigo (sem mudanca de logica)
  - refactor: Refatoracao de codigo
  - test: Adicao de testes
  - chore: Manutencao, dependencias
  - perf: Melhoria de performance

  FORMATO:
  type(scope): subject

  REGRAS:
  1. Subject em minusculas
  2. Sem ponto final
  3. Maximo 72 caracteres
  4. Seja especifico e claro
  5. Use ingles para o commit (padrao da industria)
  6. Use modo imperativo (ex: "add" nao "added")

  EXEMPLOS:
  - feat(auth): implement JWT authentication
  - fix(api): resolve database connection timeout
  - docs(readme): update installation guide
  - refactor(user): simplify profile update logic
  - perf(query): optimize database indexes

  FORMATO DE RESPOSTA (JSON):
  {
    "type": "feat",
    "scope": "auth",
    "subject": "implement JWT authentication",
    "description": "Breve explicacao do que foi feito"
  }

  Gere a mensagem de commit baseada na tarefa e alteracoes acima.
  Retorne APENAS o JSON, sem markdown ou texto extra.
