name: card_semantic_prompt
version: 1
category: pipeline
description: Gera prompt semantico completo para um card usando contexto do projeto, wiki, regras de negocio e hierarquia
usage_type: prompt_generation
estimated_tokens: 3000
tags:
  - pipeline
  - card
  - prompt
  - semantic
  - portuguese

variables:
  required:
    - card_title
    - card_type
    - card_description
  optional:
    - parent_title
    - parent_prompt
    - project_context
    - business_rules
    - wiki_context
    - acceptance_criteria
    - tech_stack
    - labels

system_prompt: |
  Voce e um engenheiro de software senior. Gere um PROMPT SEMANTICO tecnico e completo
  para o item descrito abaixo. Este prompt sera usado por uma IA para implementar o item.

  O prompt deve incluir:
  1. Contexto do que precisa ser feito (objetivo claro)
  2. Requisitos tecnicos derivados das regras de negocio e wiki
  3. Criterios de aceitacao (se disponiveis)
  4. Stack tecnologica e padroes a seguir
  5. Referencia a componentes/arquivos existentes quando relevante

  Seja especifico, tecnico e acionavel. O prompt deve ser autocontido —
  quem ler deve conseguir implementar sem precisar de contexto adicional.

  Minimo 500 caracteres. Maximo 5000 caracteres.
  Escreva em portugues. Sem emojis.

  Responda APENAS com o texto do prompt (sem JSON, sem markdown, sem code blocks).

user_prompt: |
  **Card:** {{ card_title }}
  **Tipo:** {{ card_type }}
  **Descricao:** {{ card_description }}
  {% if labels %}**Labels:** {{ labels }}{% endif %}
  {% if acceptance_criteria %}
  **Criterios de Aceitacao:**
  {{ acceptance_criteria }}
  {% endif %}
  {% if parent_title %}
  **Contexto do Item Pai:** {{ parent_title }}
  {% if parent_prompt %}
  Prompt do pai:
  {{ parent_prompt }}
  {% endif %}
  {% endif %}
  {% if tech_stack %}**Stack Tecnologica:** {{ tech_stack }}{% endif %}
  {% if project_context %}
  **Contexto Semantico do Projeto:**
  {{ project_context }}
  {% endif %}
  {% if business_rules %}
  **Regras de Negocio Extraidas do Codigo:**
  {{ business_rules }}
  {% endif %}
  {% if wiki_context %}
  **Documentacao Wiki do Projeto:**
  {{ wiki_context }}
  {% endif %}
