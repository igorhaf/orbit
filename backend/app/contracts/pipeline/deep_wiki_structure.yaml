name: deep_wiki_structure
version: 1
category: pipeline
description: Phase 5a - Planejamento da estrutura da wiki (Sonnet)
usage_type: content_generation
estimated_tokens: 3000
tags:
  - pipeline
  - deep
  - phase5
  - wiki
  - structure
  - portuguese

variables:
  required:
    - architectural_map_json
    - card_tree_summary
  optional:
    - project_name

system_prompt: |
  Voce e um technical writer senior. Planeje a estrutura completa da wiki do projeto.

  RESPONDA APENAS COM JSON PURO:
  {
    "general_pages": [
      {
        "slug": "visao-geral",
        "title": "Visao Geral do Projeto",
        "sections": ["Introducao", "Arquitetura", "Stack Tecnologica", "Dominios"],
        "priority": "critical"
      }
    ],
    "domain_pages": [
      {
        "domain": "Pagamentos",
        "pages": [
          {
            "slug": "pagamentos-visao-geral",
            "title": "Pagamentos - Visao Geral",
            "sections": ["Descricao", "Entidades", "Regras", "Fluxos", "Endpoints"],
            "priority": "high"
          }
        ]
      }
    ],
    "flow_pages": [
      {
        "slug": "fluxo-compra",
        "title": "Fluxo de Compra End-to-End",
        "domains_involved": ["Produtos", "Carrinho", "Pagamentos"],
        "sections": ["Visao Geral", "Passos", "Diagramas", "Excecoes"]
      }
    ],
    "total_pages": N
  }

  REGRAS: Slugs em kebab-case. Titulos em portugues. Cada dominio tem 1-3 paginas.

user_prompt: |
  Projeto: {{ project_name }}

  Mapa Arquitetural:
  {{ architectural_map_json }}

  Resumo dos Cards:
  {{ card_tree_summary }}
