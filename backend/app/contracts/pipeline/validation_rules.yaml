name: validation_rules
version: 1
category: pipeline
description: Regras de validacao para outputs de IA no pipeline incremental
usage_type: validation
tags:
  - pipeline
  - validation
  - anti-hallucination
  - quality

# This contract documents the validation rules applied by pipeline_validator.py
# It is NOT a prompt - it defines the quality gates for AI outputs.

rules:
  context_merge:
    description: Validacao de merge de contexto incremental
    checks:
      - name: min_length
        rule: "Descricao atualizada >= 50 chars"
        severity: blocking
      - name: anti_shrink
        rule: "Nova descricao >= 80% do tamanho da atual"
        severity: blocking
      - name: evidence_markers
        rule: "Contem pelo menos um marcador: 'descoberto em', 'origem:', 'fonte:'"
        severity: warning

  wiki_page:
    description: Validacao de pagina wiki criada/mergeada
    checks:
      - name: min_length
        rule: "Conteudo >= 50 chars"
        severity: blocking
      - name: min_words
        rule: "Create >= 100 palavras, Merge >= 100 palavras"
        severity: blocking
      - name: mandatory_sections
        rule: "Pelo menos 3 de 6 secoes obrigatorias presentes"
        sections:
          - visao geral
          - regras de negocio
          - fluxos
          - entidades
          - restricoes
          - cenarios
        severity: blocking
      - name: evidence_markers
        rule: "Contem marcadores de origem"
        severity: warning
      - name: anti_shrink
        rule: "Merge nao pode encolher pagina abaixo de 80%"
        severity: blocking

  card_epic:
    description: Validacao de Epic (100% funcional)
    checks:
      - name: title_min_length
        rule: "Titulo >= 10 chars"
        severity: blocking
      - name: description_min_length
        rule: "Descricao >= 20 chars"
        severity: blocking
      - name: no_technical_terms
        rule: "Maximo 2 termos tecnicos permitidos"
        terms_blocked:
          - migration
          - endpoint
          - api
          - controller
          - model
          - database
          - sql
          - query
          - middleware
          - router
          - http
        severity: blocking
      - name: acceptance_criteria
        rule: "Deve ter criterios de aceitacao"
        severity: warning

  card_story:
    description: Validacao de Story (formato user story)
    checks:
      - name: title_min_length
        rule: "Titulo >= 10 chars"
        severity: blocking
      - name: description_min_length
        rule: "Descricao >= 20 chars"
        severity: blocking
      - name: user_story_format
        rule: "Deve seguir 'Como X, quero Y, para Z'"
        severity: warning
      - name: acceptance_criteria
        rule: "Deve ter criterios de aceitacao"
        severity: warning

  stories_response:
    description: Validacao de resposta AI para geracao de stories
    checks:
      - name: valid_json
        rule: "Resposta deve ser JSON valido"
        severity: blocking
      - name: stories_array
        rule: "Campo 'stories' deve ser lista"
        severity: blocking
      - name: non_empty
        rule: "Pelo menos 1 story gerada"
        severity: blocking
      - name: story_fields
        rule: "Cada story deve ter 'title' e 'description'"
        severity: blocking
