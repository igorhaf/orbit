# Contrato de Negocio: Pontuação da Fila de Prompts
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/api/routes/prompt_queue.py (linhas 38-96)
# Sistema de pontuação para ordenação de prompts na fila de execução.
# IMPORTANTE: Todas as saidas deste contrato devem ser em português.

name: queue_scoring
version: 1
domain: business
category: business
description: Pesos e estratégias de pontuação para ordenação da fila de prompts
usage_type: _config

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do prompt_queue.py - dicts de pontuação hardcoded"

tags:
  - regra-de-negocio
  - fila
  - pontuação
  - prioridade

data:
  # Pontuação por tipo de item na hierarquia (epics primeiro)
  hierarchy_scores:
    epic: 100
    story: 75
    task: 50
    bug: 60

  # Pontuação por nível de prioridade (maior = mais urgente)
  priority_scores:
    critical: 100
    high: 80
    medium: 50
    low: 25
    trivial: 10

  # Pesos das estratégias para calculo do score total
  # Cada estratégia ajusta o peso de cada fator (devem somar ~1.0)
  strategy_weights:
    balanced:
      hierarchy: 0.35
      priority: 0.30
      age: 0.10
      dependency: 0.25
    hierarchy_first:
      hierarchy: 0.60
      priority: 0.20
      age: 0.05
      dependency: 0.15
    priority_first:
      hierarchy: 0.15
      priority: 0.60
      age: 0.10
      dependency: 0.15
    age_first:
      hierarchy: 0.20
      priority: 0.20
      age: 0.45
      dependency: 0.15
    dependency_first:
      hierarchy: 0.15
      priority: 0.20
      age: 0.05
      dependency: 0.60

  # Limite máximo de idade para calculo de pontuação
  max_age_days: 100

  # Formula de dependência: max(0, 100 - num_deps * penalidade)
  dependency_penalty_per_dep: 20

rules:
  constraints:
    - id: C1
      description: "Todos os pesos de cada estratégia devem somar aproximadamente 1.0"
      applies_to: [balanced, hierarchy_first, priority_first, age_first, dependency_first]
      condition: "sum(weights) ~= 1.0"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
