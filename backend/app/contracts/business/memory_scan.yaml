# Business Contract: Memory Scan
# PROMPT #164 - Contracts Architecture
#
# Documents the business rules for Memory Scan feature.
# Based on PROMPTs: #118 (Initial Implementation), #163 (Multi-phase Analysis)

name: memory_scan
version: 1
domain: business
category: business
description: Regras de negocio para scan de memória do codebase durante criação de projeto
usage_type: _config

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-04"
  change_log:
    - version: 1
      date: "2026-02-04"
      author: "Claude"
      changes: "Versão inicial documentando regras de scan de memória"

semantic_map:
  # Entidades
  N1: "Codebase - Pasta de código-fonte sendo analisada"
  N2: "CodeSample - Conteúdo de arquivo individual para análise"
  N3: "StackInfo - Stack tecnologica detectada"
  N4: "BusinessRule - Regra extraida do código"
  N5: "SuggestedTitle - Título do projeto gerado por IA"

  # Processos
  P1: "Detecção de Stack - Identificar frameworks e linguagens"
  P2: "Extracao de Arquivos - Selecionar arquivos representativos"
  P3: "Análise Multi-fase - Analisar código em fases focadas"
  P4: "Consolidacao - Unificar resultados das fases no output final"
  P5: "Indexação RAG - Armazenar arquivos para recuperação"

  # Dados
  D1: "ScanDepthConfig - configurações quick/normal/deep"
  D2: "PhaseResult - titulo_parcial, regras, features, entidades"
  D3: "ConsolidatedResult - título final, regras, features, contexto"

  # Restricoes
  C1: "Modo rápido: 30 arquivos, 2 fases"
  C2: "Modo normal: 100 arquivos, 4 fases"
  C3: "Modo profundo: TODOS os arquivos, N fases (15 arquivos cada)"
  C4: "Cada fase salva prompt no banco de dados para visibilidade"

  # Critérios de Aceitação
  AC1: "Usuário pode selecionar profundidade do scan antes de escanear"
  AC2: "IA sugere título do projeto baseado no domínio, não na tecnologia"
  AC3: "Regras de negocio são extraidas e armazenadas no RAG"
  AC4: "Todos os prompts aparecem na página /prompts"

rules:
  validations:
    - id: V1
      description: "code_path deve existir e ser um diretório"
      expression: "N1.path.exists() AND N1.path.is_dir()"
      severity: error

    - id: V2
      description: "Profundidade do scan deve ser válida"
      expression: "scan_depth IN ['quick', 'normal', 'deep']"
      severity: error

    - id: V3
      description: "Pelo menos um código deve ser extraido"
      expression: "code_samples.length > 0"
      severity: warning

  constraints:
    - id: C1
      description: "Configurações de profundidade do scan"
      applies_to: [D1]
      condition: |
        quick: {max_files: 30, max_content: 5KB, phases: 2}
        normal: {max_files: 100, max_content: 10KB, phases: 4}
        deep: {max_files: unlimited, max_content: 20KB, phases: dynamic}

    - id: C2
      description: "Ordem das fases no modo normal"
      applies_to: [P3]
      condition: "documentação -> domínio -> lógica -> consolidacao"

    - id: C3
      description: "Priorizacao de arquivos"
      applies_to: [P2]
      condition: |
        1. README e documentação
        2. Arquivos de configuração (package.json, etc.)
        3. Migrations (maior prioridade para regras de negocio)
        4. Models/Entidades
        5. Services/UseCases
        6. Controllers/Handlers
        7. Validators/Requests

    - id: C4
      description: "project_id deve ser passado para salvar prompts"
      applies_to: [P3, P4]
      condition: "orchestrator.execute() deve receber project_id"

  access_control:
    - id: AC1
      description: "Usuário pode disparar scan de memória"
      roles: [user, admin]
      action: execute

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false

tags:
  - business-rule
  - memory-scan
  - codebase-analysis
  - multi-phase
  - scan-depth
