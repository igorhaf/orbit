# Contrato de Negocio: Contagens de Geração de Cards
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fontes: context_generator.py, watchdog.py, card_hierarchy.yaml
# Quantos filhos são gerados em cada nível da hierarquia ao ativar um card.
# IMPORTANTE: Todas as saidas deste contrato devem ser em português.

name: generation_counts
version: 1
domain: business
category: business
description: Contagens padrão de geração para cada nível da hierarquia de cards
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do context_generator.py e watchdog.py"

tags:
  - regra-de-negocio
  - geração
  - hierarquia
  - contagens

data:
  # Contagem padrão de filhos por tipo de pai (usado na geração de drafts)
  default_children_count:
    epic: 15       # Epic gera 15-20 Stories
    story: 8       # Story gera 5-8 Tasks
    task: 5        # Task gera 3-5 Subtasks

  # Faixas de geração (para documentação e instruções de prompt)
  children_range:
    epic:
      min: 15
      max: 20
    story:
      min: 5
      max: 8
    task:
      min: 3
      max: 5

  # Limites de auto-descoberta do Watchdog
  max_cards_per_cycle: 5

  # Cards stub auto-enriquecidos por ciclo (quando ocioso)
  max_enrich_per_cycle: 2

rules:
  constraints:
    - id: C1
      description: "Subtask e no folha - nenhum filho e gerado"
      applies_to: [subtask]
      condition: "children_count == 0"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
