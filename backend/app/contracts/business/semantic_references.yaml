# Business Contract: Semantic References Methodology
# PROMPT #164 - Contracts Architecture
#
# Documents the Semantic References Methodology (PROMPT #83)
# This methodology enables traceable, reusable identifiers across card generations.

name: semantic_references
version: 1
domain: business
category: business
description: Semantic References Methodology for AI content generation
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-04"
  change_log:
    - version: 1
      date: "2026-02-04"
      author: "Claude"
      changes: "Initial version documenting semantic references methodology"

semantic_map:
  # Meta: This contract uses its own methodology to document itself

  # Identifier Categories
  N1: "Noun Identifier - Represents entities, objects, actors"
  P1: "Process Identifier - Represents actions, flows, operations"
  E1: "Endpoint Identifier - Represents API endpoints"
  D1: "Data Identifier - Represents data structures, schemas"
  S1: "Service Identifier - Represents external services, integrations"
  C1: "Constraint Identifier - Represents business rules, validations"
  AC1: "Acceptance Criteria Identifier - Represents verification conditions"
  R1: "Requirement Identifier - Represents functional requirements"
  F1: "Feature Identifier - Represents product features"
  M1: "Module Identifier - Represents system modules"

  # Core Concepts
  N2: "Semantic Map - Dictionary of identifier -> meaning"
  N3: "Generated Prompt - AI output with semantic identifiers"
  N4: "Human Description - Converted text with meanings"

  # Processes
  P2: "Identifier Assignment - AI assigns unique identifiers"
  P3: "Semantic Conversion - Convert identifiers to human text"
  P4: "Inheritance - Child cards inherit parent identifiers"

rules:
  validations:
    - id: V1
      description: "Identifiers must follow pattern: Letter + Number"
      expression: "identifier matches /^[A-Z]+[0-9]+$/"
      severity: error

    - id: V2
      description: "Each identifier must have unique meaning within semantic_map"
      expression: "semantic_map.values().are_unique()"
      severity: error

    - id: V3
      description: "Identifiers must be defined before use"
      expression: "used_identifiers.subset_of(semantic_map.keys())"
      severity: warning

  constraints:
    - id: C1
      description: "Identifier categories are predefined"
      applies_to: [N1, P1, E1, D1, S1, C1, AC1, R1, F1, M1]
      condition: "Category letters: N, P, E, D, S, C, AC, R, F, M"

    - id: C2
      description: "Identifiers are immutable once assigned"
      applies_to: [N2]
      condition: "Once N1='User' is set, N1 always means 'User' in that context"

    - id: C3
      description: "Child cards reuse parent identifiers"
      applies_to: [N2, P4]
      condition: "Story uses Epic's N1, P1, etc. with same meanings"

    - id: C4
      description: "New identifiers increment from parent's highest"
      applies_to: [N2, P2]
      condition: "If parent has N1-N5, child adds N6, N7..."

  access_control: []

variables:
  required: []
  optional: []

# Documentation content explaining the methodology
system_prompt: |
  ## METODOLOGIA DE REFERÊNCIAS SEMÂNTICAS

  Esta metodologia permite criar conteúdo estruturado e rastreável usando
  identificadores semânticos únicos.

  ### CATEGORIAS DE IDENTIFICADORES

  | Prefixo | Categoria | Descrição | Exemplo |
  |---------|-----------|-----------|---------|
  | N | Nouns | Entidades, objetos, atores | N1: "Usuário", N2: "Produto" |
  | P | Processes | Ações, fluxos, operações | P1: "Autenticação", P2: "Compra" |
  | E | Endpoints | APIs, rotas | E1: "/api/users", E2: "/api/products" |
  | D | Data | Estruturas de dados | D1: "UserSchema", D2: "OrderData" |
  | S | Services | Serviços externos | S1: "Stripe", S2: "SendGrid" |
  | C | Constraints | Regras de negócio | C1: "Email único", C2: "Limite 10 itens" |
  | AC | Acceptance Criteria | Critérios de aceitação | AC1: "Usuário pode logar" |
  | R | Requirements | Requisitos funcionais | R1: "Sistema deve validar CPF" |
  | F | Features | Funcionalidades | F1: "Carrinho de compras" |
  | M | Modules | Módulos do sistema | M1: "Autenticação", M2: "Pagamentos" |

  ### REGRAS DE USO

  1. **Unicidade**: Cada identificador tem significado único no contexto
  2. **Imutabilidade**: Uma vez definido, o significado não muda
  3. **Herança**: Cards filhos herdam identificadores do pai
  4. **Incremento**: Novos identificadores incrementam do maior existente
  5. **Rastreabilidade**: Identificadores permitem rastrear requisitos

  ### EXEMPLO DE MAPA SEMÂNTICO

  ```yaml
  semantic_map:
    N1: "Usuário do sistema"
    N2: "Produto no catálogo"
    N3: "Carrinho de compras"
    P1: "Processo de checkout"
    P2: "Validação de pagamento"
    D1: "Dados do pedido"
    C1: "Máximo 10 itens por carrinho"
    AC1: "Usuário consegue finalizar compra"
  ```

  ### DUAL OUTPUT

  O sistema gera dois outputs:
  1. **generated_prompt**: Texto com identificadores (N1, P1, etc.)
  2. **description**: Texto convertido com significados humanos

user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false

tags:
  - business-rule
  - methodology
  - semantic-references
  - identifiers
  - traceability
