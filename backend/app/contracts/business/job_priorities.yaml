# Contrato de Negocio: Matriz de Prioridade de Jobs
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/models/async_job.py (linhas 72-100)
# Mapeia tipos de job para niveis de prioridade padrao na fila do PriorityJobExecutor.
# IMPORTANTE: Todas as saidas deste contrato devem ser em portugues.

name: job_priorities
version: 1
domain: business
category: business
description: Niveis de prioridade padrao para cada tipo de job assincrono
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do async_job.py - JOB_TYPE_DEFAULT_PRIORITY hardcoded"

tags:
  - regra-de-negocio
  - fila-de-jobs
  - prioridade

data:
  # Niveis de prioridade (numero menor = menor prioridade, maior = mais urgente)
  priority_levels:
    CRITICAL: 10
    HIGH: 7
    NORMAL: 5
    LOW: 3

  # Prioridade padrao por tipo de job
  priorities:
    # CRITICO - usuario aguardando ativamente no chat
    interview_question: 10
    interview_message: 10
    # ALTO - usuario no wizard, aguardando resultado
    context_generation: 7
    project_title: 7
    project_pipeline: 7
    # NORMAL - usuario disparou, pode aguardar
    memory_scan: 5
    commit_generation: 5
    task_execution: 5
    suggested_epics: 5
    cards_from_memory: 5
    # BAIXO - geracao em segundo plano
    children_generation: 3
    epic_activation: 3
    story_activation: 3
    task_activation: 3
    subtask_activation: 3
    backlog_generation: 3
    task_generation: 3
    batch_execution: 3
    project_provisioning: 3
    rag_continuous_scan: 3

rules:
  constraints:
    - id: C1
      description: "Jobs interativos (usuario aguardando) devem ser CRITICO ou ALTO"
      applies_to: [interview_question, interview_message, context_generation]
      condition: "priority >= 7"
    - id: C2
      description: "Jobs de segundo plano devem ser BAIXO"
      applies_to: [rag_continuous_scan, backlog_generation]
      condition: "priority <= 3"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
