# Contrato de Execução: Limites de Otimização de Contexto
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/services/general_context_builder.py (linhas 26-48)
# Limites por nível de complexidade para otimização de contexto antes de chamadas de IA.
# IMPORTANTE: Todas as saidas deste contrato devem ser em português.

name: context_limits
version: 1
domain: business
category: execution
description: Limites por nível de complexidade para histórico de mensagens, system prompt e blocos de código
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do general_context_builder.py - dicts hardcoded de limites"

tags:
  - execução
  - contexto
  - otimização
  - tokens

data:
  # Máximo de mensagens a manter por nível de complexidade (pares usuário+assistente)
  # 0 = ilimitado
  message_limits:
    simple: 2
    moderate: 6
    complex: 12

  # Limites de caracteres do system prompt por nível
  # 0 = ilimitado
  system_prompt_limits:
    simple: 500
    moderate: 2000
    complex: 0

  # Limites de truncamento de blocos de código (caracteres)
  # 0 = ilimitado
  code_block_limits:
    simple: 500
    moderate: 2000
    complex: 0

  # Linhas a manter no início/fim ao truncar blocos de código
  code_truncate_head: 15
  code_truncate_tail: 10

rules:
  constraints:
    - id: C1
      description: "Nível simples tem os limites mais restritivos"
      condition: "simple.limits < moderate.limits < complex.limits"
    - id: C2
      description: "Nível complexo permite ilimitado para a maioria dos recursos"
      condition: "complex.system_prompt == 0 AND complex.code_block == 0"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
