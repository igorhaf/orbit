# Contrato de Execucao: Limites de Otimizacao de Contexto
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/services/general_context_builder.py (linhas 26-48)
# Limites por nivel de complexidade para otimizacao de contexto antes de chamadas de IA.
# IMPORTANTE: Todas as saidas deste contrato devem ser em portugues.

name: context_limits
version: 1
domain: business
category: execution
description: Limites por nivel de complexidade para historico de mensagens, system prompt e blocos de codigo
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do general_context_builder.py - dicts hardcoded de limites"

tags:
  - execucao
  - contexto
  - otimizacao
  - tokens

data:
  # Maximo de mensagens a manter por nivel de complexidade (pares usuario+assistente)
  # 0 = ilimitado
  message_limits:
    simple: 2
    moderate: 6
    complex: 12

  # Limites de caracteres do system prompt por nivel
  # 0 = ilimitado
  system_prompt_limits:
    simple: 500
    moderate: 2000
    complex: 0

  # Limites de truncamento de blocos de codigo (caracteres)
  # 0 = ilimitado
  code_block_limits:
    simple: 500
    moderate: 2000
    complex: 0

  # Linhas a manter no inicio/fim ao truncar blocos de codigo
  code_truncate_head: 15
  code_truncate_tail: 10

rules:
  constraints:
    - id: C1
      description: "Nivel simples tem os limites mais restritivos"
      condition: "simple.limits < moderate.limits < complex.limits"
    - id: C2
      description: "Nivel complexo permite ilimitado para a maioria dos recursos"
      condition: "complex.system_prompt == 0 AND complex.code_block == 0"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
