# Contrato de Execução: Orcamentos de Tokens
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fonte: backend/app/services/task_execution/budget_manager.py (linhas 47-78)
# Alocacao de orçamento de tokens baseado em story points e tipo de item.
# IMPORTANTE: Todas as saidas deste contrato devem ser em português.

name: token_budgets
version: 1
domain: business
category: execution
description: Alocacao de orçamento de tokens por story points e tipo de item
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado do budget_manager.py - dicts hardcoded de orçamento"

tags:
  - execução
  - tokens
  - orçamento
  - custo

data:
  # Orçamento base padrão quando nenhum outro critério se aplica
  default_budget: 2500

  # Story Points → Orçamento de tokens (escala Fibonacci)
  story_point_budgets:
    1: 2000
    2: 2000
    3: 2500
    5: 3000
    8: 4000
    13: 5000
    21: 6000

  # Tipo de Item → Orçamento de tokens
  type_budgets:
    subtask: 1500
    task: 2500
    bug: 2000
    story: 4000
    epic: 6000

  # Orçamento usa max(story_point_budget, type_budget, default_budget)

rules:
  constraints:
    - id: C1
      description: "Orçamento e sempre o máximo entre story_point e type_budget"
      condition: "budget = max(story_point_budget, type_budget, default_budget)"
    - id: C2
      description: "Story points usam o número Fibonacci mais próximo"
      condition: "closest = min(fibonacci_keys, key=lambda x: abs(x - story_points))"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
