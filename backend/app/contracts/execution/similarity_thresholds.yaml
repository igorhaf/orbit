# Contrato de Execucao: Limiares de Similaridade
# PROMPT #256 - Externalizar Contratos Hardcoded
#
# Fontes: ai_orchestrator.py, similarity_detector.py, context_generator.py,
#          continuous_rag_service.py, interview_handlers.py, backlog_generator.py
# Limiares de similaridade semantica para diferentes operacoes.
# IMPORTANTE: Todas as saidas deste contrato devem ser em portugues.

name: similarity_thresholds
version: 1
domain: business
category: execution
description: Limiares de similaridade para deduplicacao, cache e pontuacao de relevancia
usage_type: business_rule

governance:
  status: active
  owner: "ORBIT Core Team"
  effective_date: "2026-02-13"
  change_log:
    - version: 1
      date: "2026-02-13"
      author: "Claude"
      changes: "Externalizado de 9+ arquivos com limiares de similaridade hardcoded"

tags:
  - execucao
  - similaridade
  - limiar
  - deduplicacao

data:
  thresholds:
    # Cache: correspondencia semantica exata (ai_orchestrator.py)
    exact_match_cache: 0.95

    # Deteccao de modificacao: >90% = modificar existente (similarity_detector.py)
    modification_detection: 0.90

    # Deduplicacao de cards: evitar criar cards duplicados (context_generator.py, watchdog.py)
    card_deduplication: 0.85

    # Relevancia RAG: relevancia minima para resultados RAG (continuous_rag_service.py)
    rag_relevance: 0.85

    # Deduplicacao de backlog/entrevista (backlog_generator.py, interview_handlers.py)
    backlog_deduplication: 0.60

    # Busca geral em memoria (codebase_memory.py)
    memory_search: 0.50

    # Sem filtragem - obter todos os resultados (interview_handlers.py)
    no_filter: 0.0

rules:
  constraints:
    - id: C1
      description: "Limiares mais altos = correspondencia mais rigorosa"
      condition: "exact_match_cache > modification_detection > card_deduplication > backlog_deduplication > memory_search"

variables:
  required: []
  optional: []

system_prompt: ""
user_prompt: ""

execution:
  estimated_tokens: 0
  cache_enabled: false
