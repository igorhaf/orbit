name: orbit-suinda
services:
  db:
    image: postgres:16-alpine
    container_name: suinda-db
    env_file: ./data/db.env
    volumes:
      - suinda_db_data:/var/lib/postgresql/data
      - ./data/db-init:/docker-entrypoint-initdb.d:ro
    ports: [ "127.0.0.1:5434:5432" ]
    networks: [ suinda ]
    restart: unless-stopped
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    memswap_limit: 1536m
    mem_reservation: 128m

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    container_name: suinda-clamav
    volumes:
      - suinda_clamav_db:/var/lib/clamav
    networks: [ suinda ]
    restart: unless-stopped
    security_opt: [ no-new-privileges:true ]
    mem_limit: 3g
    memswap_limit: 5g
    mem_reservation: 128m

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        ORBIT_API_PROXY_URL: http://api:4000
        THEME: dark
    image: orbit-api-suinda:local
    container_name: suinda-api
    env_file: ./data/config/api.env
    environment:
      ORBIT_ENV: development
      ORBIT_PRODUCT: suinda
      ORBIT_API_ONLY: "true"
      ORBIT_NEXT_DIST_DIR: .next-suinda
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      API_PUBLIC_URL: ${SUINDA_API_PUBLIC_URL:-http://localhost:4004}
      WEB_ORIGIN: http://localhost:3003
      SUINDA_WEB_ORIGIN: ${SUINDA_WEB_ORIGIN:-http://localhost:3003}
      ORBIT_API_ENV_FILE: /data/config/api.env
      ORBIT_BACKUP_DIR: /data/backups
      ORBIT_DOCUMENT_SCANNER_URL: tcp://clamav:3310
      HOME: /tmp
      CODEX_HOME: /data/sessions
      ORBIT_DEV_BUILD_LOCK: /run/orbit-dev-locks/build.lock
    volumes:
      - ./data/config:/data/config:rw
      - ./data/backups:/data/backups:rw
      - ./data/sessions:/data/sessions:rw
      - ./app:/home/meada/projetos/orbit:rw
      - suinda_node_modules:/home/meada/projetos/orbit/node_modules:rw
      - ../control/state/dev-locks:/run/orbit-dev-locks:rw
    ports: [ "127.0.0.1:4004:4000" ]
    networks: [ suinda ]
    depends_on:
      db: { condition: service_healthy }
      clamav: { condition: service_healthy }
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, node, -e, "(async()=>{const r=await fetch('http://127.0.0.1:4000/health');process.exit(r.status<500?0:1)})().catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    init: true
    mem_limit: 2g
    memswap_limit: 3g
    mem_reservation: 256m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        ORBIT_API_PROXY_URL: http://api:4000
        THEME: dark
    image: orbit-web-suinda:local
    container_name: suinda-web
    environment:
      ORBIT_API_PROXY_URL: http://api:4000
      WEB_HOSTNAME: 0.0.0.0
      PORT: "3000"
      THEME: dark
      NEXT_PUBLIC_ORBIT_THEME: dark
      NEXT_PUBLIC_ORBIT_PORT: "3003"
      NEXT_PUBLIC_ORBIT_PRODUCT_NAME: Suindá
      ORBIT_NEXT_DIST_DIR: .next-suinda
      ORBIT_DEV_MEMORY_MODE: ${ORBIT_DEV_MEMORY_MODE:-conserve}
    volumes:
      - ./app:/home/meada/projetos/orbit:rw
      - suinda_node_modules:/home/meada/projetos/orbit/node_modules:rw
    ports: [ "127.0.0.1:3003:3000" ]
    command:
      - npm
      - run
      - dev:turbopack
      - -w
      - apps/web
    networks: [ suinda ]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    init: true
    mem_limit: 2g
    memswap_limit: 3g
    mem_reservation: 384m

volumes:
  suinda_node_modules:
    name: orbit_suinda_node_modules
  suinda_clamav_db:
    name: orbit_suinda_clamav_db
  suinda_db_data:
    external: true
    name: 17f1149c80d388aabdcd4f1cdd2879704e8367a0dbaea127795a462dfe0bb5aa
networks:
  suinda:
    name: orbit_suinda_net
